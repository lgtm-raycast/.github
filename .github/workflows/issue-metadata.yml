---
name: Issue metadata
"on":
  issues:
    types: [opened, reopened, unassigned, unlabeled]
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: issue-metadata
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile issue metadata
        uses: ./actions/issue-metadata
        with:
          issue-number: ${{ github.event.issue.number || '0' }}
          reconcile-all: ${{ github.event_name != 'issues' }}
