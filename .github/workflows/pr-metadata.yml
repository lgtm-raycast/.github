---
name: PR metadata
# Only pinned metadata workflows run with this token; they execute no PR code.
"on":
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  # runner-image support awaits the release of lgtm-hq/lgtm-ci#1204.
  label:
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      egress-policy: block
    permissions:
      contents: read
      pull-requests: write
  assign:
    if: github.event.action == 'opened'
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    permissions:
      contents: read
      pull-requests: write
    with:
      egress-policy: block
      runner-image: ubuntu-26.04
