---
name: PR metadata
# Only pinned metadata workflows run with this token; they execute no PR code.
"on":
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  # runner-image support awaits the release of lgtm-hq/lgtm-ci#1204.
  label:
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@2097a900753e3e5ad0e336483501b278e99855ae # v0.78.1
    with:
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
    permissions:
      contents: read
      pull-requests: write
  assign:
    if: github.event.action == 'opened'
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@2097a900753e3e5ad0e336483501b278e99855ae # v0.78.1
    permissions:
      contents: read
      pull-requests: write
    with:
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      runner-image: ubuntu-26.04
