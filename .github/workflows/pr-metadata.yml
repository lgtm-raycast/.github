---
name: PR metadata
# Only pinned metadata workflows run with this token; they execute no PR code.
"on":
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  # runner-image support awaits the release of lgtm-hq/lgtm-ci#1204.
  label:
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@024df453a44d6b9f26f733efd3e93f728cbaa11b # v0.111.0
    with:
      egress-policy: block
    permissions:
      contents: read
      pull-requests: write
  assign:
    if: github.event.action == 'opened'
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@024df453a44d6b9f26f733efd3e93f728cbaa11b # v0.111.0
    permissions:
      contents: read
      pull-requests: write
    with:
      egress-policy: block
      runner-image: ubuntu-26.04
