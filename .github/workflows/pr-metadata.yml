---
name: PR metadata
# Only pinned metadata workflows run with this token; they execute no PR code.
"on":
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  # runner-image support awaits the release of lgtm-hq/lgtm-ci#1204.
  label:
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@8f0fd9339df5d30a529aa572ceb51345b8be33a0 # v0.79.2
    with:
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
    permissions:
      contents: read
      pull-requests: write
  assign:
    if: github.event.action == 'opened'
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@8f0fd9339df5d30a529aa572ceb51345b8be33a0 # v0.79.2
    permissions:
      contents: read
      pull-requests: write
    with:
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      runner-image: ubuntu-26.04
