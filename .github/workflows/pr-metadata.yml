---
name: PR metadata
# Only pinned metadata workflows run with this token; they execute no PR code.
"on":
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  # runner-image support awaits the release of lgtm-hq/lgtm-ci#1204.
  label:
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    with:
      egress-policy: block
    permissions:
      contents: read
      pull-requests: write
  assign:
    if: github.event.action == 'opened'
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    permissions:
      contents: read
      pull-requests: write
    with:
      egress-policy: block
      runner-image: ubuntu-26.04
