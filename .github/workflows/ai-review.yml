---
name: AI Review
"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: community-ai-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ai-review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-ai-review.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb # v0.78.0
    permissions:
      contents: read
      pull-requests: read
      actions: read
    secrets:
      LINTRO_REVIEW_APP_ID: ${{ secrets.LINTRO_REVIEW_APP_ID }}
      LINTRO_REVIEW_APP_PRIVATE_KEY: ${{ secrets.LINTRO_REVIEW_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      runner-image: ubuntu-26.04
      provider: anthropic
      transport: cli
      lintro-version: "0.173.1"
      blocking: true
      max-diff-lines: 0
      timeout-minutes: 30
      job-name: Lintro AI review
