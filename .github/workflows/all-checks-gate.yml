---
name: All Checks Gate
"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
permissions: {}
concurrency:
  group: all-checks-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-all-checks-gate.yml@024df453a44d6b9f26f733efd3e93f728cbaa11b # v0.111.0
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
    with:
      egress-policy: block
      runner-image: ubuntu-26.04
