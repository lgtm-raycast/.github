---
name: All Checks Gate
"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
permissions: {}
concurrency:
  group: all-checks-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-all-checks-gate.yml@8f0fd9339df5d30a529aa572ceb51345b8be33a0 # v0.79.2
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
    with:
      egress-policy: block
      runner-image: ubuntu-26.04
