---
name: All Checks Gate
"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
permissions: {}
concurrency:
  group: all-checks-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-all-checks-gate.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
    with:
      egress-policy: block
      runner-image: ubuntu-26.04
