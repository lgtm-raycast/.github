---
name: All Checks Gate
"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
permissions: {}
concurrency:
  group: all-checks-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-all-checks-gate.yml@d9e2ca3a4a7646bf7b4a810567db65a781267ce6 # v0.116.5
    permissions:
      actions: read
      checks: read
      contents: read
      statuses: read
    with:
      egress-policy: block
      runner-image: ubuntu-26.04
